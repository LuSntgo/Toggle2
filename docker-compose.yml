version: "3.9"

# ToggleMaster — Fase 2 — Ambiente local completo (9 containers)
# Atualizado: Correção de travamento do SQLite/DynamoDB no Windows

services:

  # ---------------------------------------------------------------------
  # BANCOS DE DADOS LOCAIS (4 no total)
  # ---------------------------------------------------------------------

  # Postgres 1: usado pelo auth-service
  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata_auth:/var/lib/postgresql/data
      - ./db-init/auth/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - togglemaster-net

  # Postgres 2: compartilhado por flag-service e targeting-service
  postgres-flags-targeting:
    image: postgres:15-alpine
    container_name: postgres-flags-targeting
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flags_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata_flags_targeting:/var/lib/postgresql/data
      - ./db-init/multi-db/00-init-databases.sh:/docker-entrypoint-initdb.d/00-init-databases.sh:ro
      - ./db-init/flags/init.sql:/docker-entrypoint-initdb.d/flag-service-init.sql:ro
      - ./db-init/targeting/init.sql:/docker-entrypoint-initdb.d/targeting-service-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flags_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - togglemaster-net

  # Redis: cache do evaluation-service
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - togglemaster-net

  # DynamoDB Local: Ajustado para rodar em memória, evitando erros de I/O de disco no Windows
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    restart: unless-stopped
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory"]
    working_dir: /home/dynamodblocal
    ports:
      - "8000:8000"
    networks:
      - togglemaster-net

  # Inicializador do DynamoDB Local
  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: dynamodb-init
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Aguardando DynamoDB Local ficar disponível...";
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 > /dev/null 2>&1; do
          sleep 2;
        done;
        echo "Criando tabela ToggleMasterAnalytics (se ainda não existir)...";
        aws dynamodb create-table \
          --table-name ToggleMasterAnalytics \
          --attribute-definitions AttributeName=event_id,AttributeType=S \
          --key-schema AttributeName=event_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000 \
          || echo "Tabela já existe, seguindo em frente.";
    networks:
      - togglemaster-net

  # ---------------------------------------------------------------------
  # MICROSSERVIÇOS (5 no total)
  # ---------------------------------------------------------------------

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres-auth:5432/auth_db?sslmode=disable"
      PORT: "8001"
      MASTER_KEY: "admin-secreto-123"
    ports:
      - "8001:8001"
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - togglemaster-net

  flag-service:
    build:
      context: ./flag-service
      dockerfile: Dockerfile
    container_name: flag-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres-flags-targeting:5432/flags_db?sslmode=disable"
      PORT: "8002"
      AUTH_SERVICE_URL: "http://auth-service:8001"
    ports:
      - "8002:8002"
    depends_on:
      postgres-flags-targeting:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - togglemaster-net

  targeting-service:
    build:
      context: ./targeting-service
      dockerfile: Dockerfile
    container_name: targeting-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres-flags-targeting:5432/targeting_db?sslmode=disable"
      PORT: "8003"
      AUTH_SERVICE_URL: "http://auth-service:8001"
    ports:
      - "8003:8003"
    depends_on:
      postgres-flags-targeting:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - togglemaster-net

  evaluation-service:
    build:
      context: ./evaluation-service
      dockerfile: Dockerfile
    container_name: evaluation-service
    restart: unless-stopped
    environment:
      PORT: "8004"
      REDIS_URL: "redis://redis:6379"
      FLAG_SERVICE_URL: "http://flag-service:8002"
      TARGETING_SERVICE_URL: "http://targeting-service:8003"
      SERVICE_API_KEY: "local-dev-key"
      AWS_SQS_URL: ""
      AWS_REGION: "us-east-1"
    ports:
      - "8004:8004"
    depends_on:
      redis:
        condition: service_healthy
      flag-service:
        condition: service_started
      targeting-service:
        condition: service_started
    networks:
      - togglemaster-net

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    restart: on-failure:3
    environment:
      PORT: "8005"
      AWS_REGION: "us-east-1"
      AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"
      AWS_SQS_URL: "${AWS_SQS_URL:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
    ports:
      - "8005:8005"
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    networks:
      - togglemaster-net

networks:
  togglemaster-net:
    driver: bridge

volumes:
  pgdata_auth:
  pgdata_flags_targeting: