name: CI Flag Service

on:
  push:
    branches: [main]
    paths:
      - 'flag-service/**'
      - '.github/workflows/ci-flag-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flag-service/**'
      - '.github/workflows/ci-flag-service.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: flag-service
  SERVICE_DIR: flag-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    name: Build, Lint & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flag-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install ruff==0.16.5 bandit==1.9.4
      - name: Lint with Ruff
        run: ruff check .
      - name: Unit tests
        run: python -m unittest discover -s . -p 'test*.py'
      - name: SAST with Bandit
        run: bandit -r . -ll

  dependency-scan:
    name: SCA - Filesystem
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: SCA with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./${{ env.SERVICE_DIR }}
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  docker-build-push:
    name: Docker Build, Scan & ECR Push
    runs-on: ubuntu-latest
    needs: dependency-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker build --pull -t "$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" "${{ env.SERVICE_DIR }}"
      - name: Container scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Push image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push "$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"

  update-gitops:
    name: Update GitOps Repo
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: LuSntgo/togglemaster-gitops
          token: ${{ secrets.GITOPS_GITHUB_TOKEN }}
          path: gitops
      - name: Update deployment image tag
        working-directory: gitops
        env:
          IMAGE: 239510186324.dkr.ecr.us-east-1.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          path = Path('apps') / os.environ['ECR_REPOSITORY'] / 'deployment.yaml'
          if not path.is_file():
              raise SystemExit(f'Arquivo não encontrado: {path}')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          for index, line in enumerate(lines):
              if line.lstrip().startswith('image:'):
                  prefix = line[:len(line) - len(line.lstrip())]
                  lines[index] = f"{prefix}image: {os.environ['IMAGE']}\n"
                  break
          else:
              raise SystemExit(f'Campo image não encontrado: {path}')
          path.write_text(''.join(lines), encoding='utf-8')
          PY
      - name: Commit and push GitOps change
        working-directory: gitops
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "apps/${{ env.ECR_REPOSITORY }}/deployment.yaml"
          if git diff --cached --quiet; then echo 'Nenhuma alteração necessária'; exit 0; fi
          git commit -m "chore: update ${{ env.ECR_REPOSITORY }} image to ${{ env.IMAGE_TAG }}"
          git push