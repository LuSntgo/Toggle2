name: CI Targeting Service

on:
  push:
    branches: [ main ]
    paths:
      - 'targeting-service/**'
      - '.github/workflows/ci-targeting-service.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'targeting-service/**'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: targeting-service
  SERVICE_DIR: targeting-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Unit Tests
        run: |
          cd ${{ env.SERVICE_DIR }}
          go test -v ./... || true

  security-scan:
    name: DevSecOps Scans (SAST & SCA)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SCA Scan (Trivy FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ env.SERVICE_DIR }}'
          severity: 'CRITICAL'
          exit-code: '1'

  docker-build-push:
    name: Docker Build, Scan & ECR Push
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} ./${{ env.SERVICE_DIR }}

      - name: Container Image Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Push Image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

  update-gitops:
    name: Update GitOps Repo
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: 'LuSntgo/togglemaster-gitops'
          token: ${{ secrets.GITOPS_GITHUB_TOKEN }}

      - name: Update deployment.yaml tag
        run: |
          cd apps/${{ env.ECR_REPOSITORY }}
          sed -i 's|image: .*|image: 239510186324.dkr.ecr.us-east-1.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}|g' deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update ${{ env.ECR_REPOSITORY }} image tag to ${{ env.IMAGE_TAG }}"
          git push