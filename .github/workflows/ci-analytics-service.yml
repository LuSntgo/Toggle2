name: CI Analytics Service

on:
  push:
    branches: [ main ]
    paths:
      - 'analytics-service/**'
      - '.github/workflows/ci-analytics-service.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'analytics-service/**'
      - '.github/workflows/ci-analytics-service.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: analytics-service
  SERVICE_DIR: analytics-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ---- Requisito 2.1: Build & Unit Test ----
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Unit Tests
        run: python -m unittest discover -s . -p 'test*.py'
        # Sem "|| true": um teste falho precisa quebrar o pipeline de verdade.

  # ---- Requisito 2.2: Linter/Static Analysis ----
  lint:
    name: Linter (Ruff)
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff==0.16.5

      - name: Lint with Ruff
        run: ruff check .

  # ---- Requisito 2.3 (parte 1): SAST ----
  sast-scan:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit==1.9.4

      - name: SAST Scan (Bandit)
        run: bandit -r . -ll
        # -ll = bloqueia em MEDIUM e HIGH (Bandit não tem nível CRITICAL).
        # Ajuste para -lll se quiser bloquear só em HIGH.

  # ---- Requisito 2.3 (parte 2): SCA ----
  sca-scan:
    name: SCA (Trivy Filesystem)
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SCA Scan (Trivy FS)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './${{ env.SERVICE_DIR }}'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: false
        # Regra de Bloqueio: qualquer CRITICAL nas dependências derruba o pipeline aqui.

  # ---- Requisito 2.4: Docker Build & Push ----
  docker-build-push:
    name: Docker Build, Scan & ECR Push
    runs-on: ubuntu-latest
    needs: sca-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} ./${{ env.SERVICE_DIR }}

      - name: Container Image Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: false
        # Regra de Bloqueio: qualquer CRITICAL na imagem final derruba o pipeline aqui.

      - name: Push Image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

  # ---- Requisito 3.3: Atualização automática do repo GitOps ----
  update-gitops:
    name: Update GitOps Repo
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: 'LuSntgo/togglemaster-gitops'
          token: ${{ secrets.GITOPS_GITHUB_TOKEN }}

      - name: Update deployment.yaml tag
        run: |
          cd apps/${{ env.ECR_REPOSITORY }}
          sed -i 's|image: .*|image: 239510186324.dkr.ecr.us-east-1.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}|g' deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update ${{ env.ECR_REPOSITORY }} image tag to ${{ env.IMAGE_TAG }}"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejeitado (tentativa $i/5) - outro job atualizou o repo GitOps ao mesmo tempo; sincronizando e tentando de novo..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Falha ao dar push após 5 tentativas"
          exit 1